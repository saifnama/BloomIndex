[project]
name = "bloomindex"
version = "2.0.0"
description = "Literature RAG + NER + paper-reader workbench for phytochemistry and natural-product chemistry"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "uvloop==0.22.1; sys_platform != 'win32'",
    "pydantic==2.13.5",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "openai==3.13.0",
    "spacy==3.8.16",
    "langchain==1.4.0",
    "langchain-community==0.4.2",
    "langchain-core==1.6.3",
    "langchain-huggingface==1.2.2",
    "langchain-qdrant==1.1.0",
    "langchain-experimental==0.4.2",
    "langchain-text-splitters==1.1.2",
    "qdrant-client==1.19.0",
    "fastembed==0.8.0",
    "sentence-transformers==6.0.1",
    "transformers==5.17.0",
    "json-repair==0.63.4",
    "pymupdf==1.28.2",
    "docling==2.126.0",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "nh3==0.3.7",
    "numpy==2.5.3",
    "jinja2==3.1.6",
    "python-dotenv==1.2.3",
    "sqlalchemy==2.0.52",
    "greenlet==3.5.5",
    "aiosqlite==0.22.1",
    "pandas==3.0.5",
    "openpyxl==3.1.5",
    "alembic==1.20.0",
    "mako==1.4.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["eval/*", ".venv/*", "frontend/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
